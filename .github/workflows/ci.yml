name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Si llegan dos pushes seguidos a la misma rama, el primero se cancela: el
# resultado ya no interesa y ocupa un runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La versión MÍNIMA que soporta el proyecto, no la más nueva: CI está
      # para detectar lo que se rompe en el suelo soportado. Correrlo en una
      # versión más moderna que la de producción deja pasar fallos como el de
      # `WebSocket`, que solo aparecía por debajo de Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo del lockfile y falla
      # si package.json y package-lock.json no concuerdan.
      - run: npm ci

      # El resto depende de los tipos compilados de shared.
      - run: npm run build

      - run: npm run lint

      - run: npm run format:check

      # mobile no tiene .expo/types en CI (los genera Metro al arrancar), así
      # que aquí las rutas se comprueban de forma laxa. Es el único punto donde
      # CI es menos estricto que el entorno local.
      - run: npm run typecheck

      - run: npm test

  security:
    name: Secretos y dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La versión MÍNIMA que soporta el proyecto, no la más nueva: CI está
      # para detectar lo que se rompe en el suelo soportado. Correrlo en una
      # versión más moderna que la de producción deja pasar fallos como el de
      # `WebSocket`, que solo aparecía por debajo de Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Buscar secretos en lo versionado
        run: npm run check:secrets

      # No es `npm audit` a secas: falla a partir de `high`, pero permite
      # aceptar avisos concretos por escrito y con motivo. Hace falta porque
      # hay avisos publicados contra la ULTIMA version de un paquete, sin nada
      # a lo que actualizar, y un CI siempre en rojo deja de leerse. La lista
      # de aceptados vive en el propio script. Ver docs/security.md.
      - name: Auditar dependencias
        run: npm run audit:deps
